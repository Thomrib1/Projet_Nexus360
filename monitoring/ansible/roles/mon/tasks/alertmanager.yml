---
- name: Installer Alertmanager et amtool
  ansible.builtin.include_tasks: install_binary.yml
  vars:
    bin_project: alertmanager
    bin_version: "{{ alertmanager_version }}"
    bin_files: [alertmanager, amtool]
    bin_service: alertmanager

- name: Webhook de messagerie (secret, hors du fichier de configuration)
  ansible.builtin.copy:
    content: "{{ alertmanager_discord_webhook }}"
    dest: "{{ alertmanager_config_dir }}/discord_webhook"
    owner: root
    group: alertmanager
    mode: "0640"
  no_log: true
  when: alertmanager_discord_webhook | length > 0
  notify: Recharger alertmanager

- name: Configuration d'Alertmanager (routage, regroupement, inhibitions)
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
    owner: root
    group: alertmanager
    mode: "0640"
    validate: /usr/local/bin/amtool check-config %s
  notify: Recharger alertmanager

- name: Unité systemd d'Alertmanager
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer alertmanager
