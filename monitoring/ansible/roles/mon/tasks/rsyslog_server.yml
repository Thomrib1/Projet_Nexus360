---
# Exigence D1 : journaux des Linux centralisés sur LNX-MON01 (rsyslog en TCP),
# rangés par machine, avec rotation.
- name: Installer rsyslog et logrotate
  ansible.builtin.dnf:
    name: [rsyslog, logrotate]
    state: present

- name: Répertoire des journaux distants
  ansible.builtin.file:
    path: "{{ rsyslog_remote_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
    setype: var_log_t

- name: Contexte SELinux persistant pour les journaux distants
  community.general.sefcontext:
    target: "{{ rsyslog_remote_dir }}(/.*)?"
    setype: var_log_t
    state: present
  notify: Restaurer contexte journaux

- name: Configuration du serveur rsyslog central
  ansible.builtin.template:
    src: rsyslog-central.conf.j2
    dest: /etc/rsyslog.d/10-central-server.conf
    owner: root
    group: root
    mode: "0644"
    validate: rsyslogd -N1 -f %s
  notify: Redémarrer rsyslog

- name: Rotation des journaux distants
  ansible.builtin.template:
    src: logrotate-remote.j2
    dest: /etc/logrotate.d/remote-hosts
    owner: root
    group: root
    mode: "0644"
