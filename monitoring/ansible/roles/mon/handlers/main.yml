---
- name: Recharger systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restaurer contexte journaux
  ansible.builtin.command: restorecon -R {{ rsyslog_remote_dir }}
  changed_when: true

- name: Redémarrer rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    state: restarted

- name: Redémarrer prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted
    daemon_reload: true

- name: Recharger prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: reloaded

- name: Redémarrer alertmanager
  ansible.builtin.systemd_service:
    name: alertmanager
    state: restarted
    daemon_reload: true

- name: Recharger alertmanager
  ansible.builtin.systemd_service:
    name: alertmanager
    state: reloaded

- name: Redémarrer blackbox_exporter
  ansible.builtin.systemd_service:
    name: blackbox_exporter
    state: restarted
    daemon_reload: true

- name: Redémarrer grafana-server
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted
    daemon_reload: true
