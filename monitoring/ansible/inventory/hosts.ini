# Inventaire Nexus360 — RÉPARTITION PAR RÔLE (un PC = une personne = un site = un /24).
# Le 3e octet = numéro du site = numéro du rôle de la personne qui héberge les VM.
# Le plan d'adressage du DAT fait foi : si la répartition change, seul ce fichier,
# group_vars/all/main.yml, windows/config/*.json et scripts/nexus.env changent.
#
#  PC rôle 1 (Identité)          site 1  10.36.11.0/24 : LNX-GW01, SRV-DC01
#  PC rôle 2 (Services Windows)  site 2  10.36.12.0/24 : LNX-GW02, SRV-FS01, SRV-MGT01
#  PC rôle 3 (Linux)             site 3  10.36.13.0/24 : LNX-GW03, LNX-WEB01, LNX-OPS01, LNX-APP01
#  PC rôle 4 (Exploitation)      site 4  10.36.14.0/24 : LNX-GW04, SRV-DC02*, LNX-MON01
#  PC rôle 5 (Réseau et postes)  site 5  10.36.15.0/24 : LNX-GW05, CLI-W11-01, CLI-LNX01, CLI-W11-02
#  * SRV-DC02 est administré par le rôle 1 mais HÉBERGÉ sur le PC du rôle 4 :
#    le sujet impose les deux DC sur deux PC différents.

[web]
lnx-web01 ansible_host=10.36.13.21

[ops]
# Le runner CI tourne sur LNX-OPS01 : on s'y connecte en local.
lnx-ops01 ansible_host=10.36.13.22 ansible_connection=local

[mon]
lnx-mon01 ansible_host=10.36.14.23

[gw]
lnx-gw01 ansible_host=10.36.11.1
lnx-gw02 ansible_host=10.36.12.1
lnx-gw03 ansible_host=10.36.13.1
lnx-gw04 ansible_host=10.36.14.1
lnx-gw05 ansible_host=10.36.15.1

[ubuntu]
lnx-app01 ansible_host=10.36.13.24
cli-lnx01 ansible_host=10.36.15.102

[rocky:children]
web
ops
mon
gw

[linux:children]
rocky
ubuntu
