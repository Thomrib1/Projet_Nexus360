[defaults]
inventory          = inventory/hosts.ini
roles_path         = roles
collections_path   = ./collections:~/.ansible/collections
remote_user        = ansible
host_key_checking  = True
retry_files_enabled = False
forks              = 10
# Script qui lit le mot de passe du coffre dans la variable d'environnement
# ANSIBLE_VAULT_PASSWORD (secret CI). Aucun mot de passe dans le dépôt.
vault_password_file = ../scripts/vault-pass.sh
# Récapitulatif lisible + durée de chaque tâche (utile pour le journal d'exploitation)
callbacks_enabled  = ansible.posix.profile_tasks
stdout_callback    = default
result_format      = yaml

[privilege_escalation]
become        = True
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
