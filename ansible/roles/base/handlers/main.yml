---
- {name: restart chronyd, ansible.builtin.systemd: {name: chronyd, state: restarted}}
- {name: restart sssd, ansible.builtin.systemd: {name: sssd, state: restarted, enabled: true}}
- {name: restart sshd, ansible.builtin.systemd: {name: sshd, state: restarted}}
- {name: restart rsyslog, ansible.builtin.systemd: {name: rsyslog, state: restarted}}
