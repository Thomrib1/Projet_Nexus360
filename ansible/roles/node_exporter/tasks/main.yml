---
- name: Compte système node_exporter
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Archive node_exporter (empreinte vérifiée)
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    checksum: "sha256:https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/sha256sums.txt"
    mode: "0644"

- name: Binaire node_exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ['--strip-components=1', '--wildcards', '*/node_exporter']
    owner: root
    group: root
    mode: "0755"
    creates: /usr/local/bin/node_exporter
  notify: Redémarrer node_exporter
  ignore_errors: "{{ ansible_check_mode }}"  # en simulation l'archive n'est pas téléchargée

- name: Service systemd
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer node_exporter

- name: Service actif au démarrage
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"  # en simulation le service n'existe pas encore

# Pare-feu : métriques lisibles uniquement depuis la supervision (Rocky/firewalld)
- name: Pare-feu, port node_exporter ouvert pour la supervision seulement
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ node_exporter_allowed_source }}" port port="{{ node_exporter_port }}" protocol="tcp" accept'
    permanent: true
    immediate: true
    state: enabled
  when: ansible_os_family == "RedHat"
